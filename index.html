<script>
/* PWA update flow (v2): version.json is the source of truth, NOT the service
   worker. The SW exists only for offline caching — updates no longer depend on
   the SW install/waiting/skipWaiting handover, which stalls silently on iOS.
   On launch, on foreground resume, and every minute we fetch version.json
   with cache:'no-store' plus a cache-buster; if it differs from the running
   BUILD_VERSION we show the banner. Tapping it preserves installed offline caches and
   navigates to a cache-busted URL. Worker activation cleans obsolete versions. Every step reports progress; failures
   show retry + a manual fallback. Works even where SWs are unsupported. */

  var banner = document.getElementById('update-banner');
  var state = 'idle'; // idle | available | working | failed
  var remoteVersion = null;
  var failCount = 0;

  function isNewer(local, remote) {
    if (!remote || remote === local) return false;
    function ts(v) { var m = /-(\d{8})-(\d{6})$/.exec(v || ''); return m ? m[1] + m[2] : null; }
    var a = ts(local), b = ts(remote);
    if (a && b) return b >= a; // same-second double commit still counts
    return true; // unparseable: any difference counts as newer
  }

  function show(html) { banner.innerHTML = html; banner.classList.remove('hidden'); }

  var PENDING_HTML = '&#9203; New version isn&rsquo;t ready to download yet &mdash; <b>tap to check again</b>.';

  // Steve 2026-10-06: version.json goes live on push, but GitHub Pages can
  // lag minutes behind. The new build is only "available" when its files are
  // actually downloadable — otherwise tap -> reload-old -> banner-again loops
  // forever with a banner that never dismisses. Every script URL in the
  // served index.html is cache-busted with the version tag, so the new tag's
  // presence there proves the new build is live.
  function assetsLive(remote) {
    var url = 'index.html?t=' + Date.now().toString(36);
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) return false;
      return r.text();
    }).then(function (text) {
      return typeof text === 'string' && text.indexOf(remote) !== -1;
    }).catch(function () { return false; });
  }

  function check() {
    var local = window.BUILD_VERSION || '';
    var url = 'version.json?t=' + Date.now().toString(36);
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      var remote = (j && j.version) || '';
      if (!isNewer(local, remote)) return false;
      return assetsLive(remote).then(function (live) {
        if (!live) {
          // Not downloadable yet — stay silent (or keep the pending notice).
          // The 15-min / foreground re-check is the auto-retry.
          if (state !== 'pending') state = 'idle';
          return false;
        }
        remoteVersion = remote;
        state = 'available';
        failCount = 0;
        show('&#11015; A new version is ready &mdash; <b>tap to update</b>');
        return true;
      });
    }).catch(function () { return false; }); // offline: stay silent
  }

  function apply() {
    if (state === 'working') return;
    state = 'working';
    show('&#9203; Downloading new version&hellip;');
    // Steve 2026-10-06: re-verify assets are live before navigating.
    // CDN can lag version.json; navigating to stale files causes the
    // "new version isn't available" pending loop.
    if (remoteVersion) {
      assetsLive(remoteVersion).then(function(live) {
        if (!live) {
          show('&#9203; New files are still propagating&hellip; waiting&hellip;');
          // Retry in 10s
          setTimeout(function() {
            state = 'available'; // allow re-tap
            apply();
          }, 10000);
          return;
        }
        // Assets confirmed live - proceed with update
        doApply();
      });
      return;
    }
    doApply();
  }
  function doApply() {
    // Preserve installed offline data through navigation. The worker cleans
    // obsolete versions on activation; the page must not race that installation.
    var navigated = false;
    function go() {
      if (navigated) return; navigated = true;
      show('&#8635; Reloading into the new version&hellip;');
      try {
        var u = new URL(window.location.href);
        u.search = '';
        u.searchParams.set('v', remoteVersion || Date.now().toString(36));
        window.location.href = u.toString();
      } catch (e) {
        try { window.location.reload(); } catch (e2) { fail(); }
      }
    }
    // Steve 2026-10-06: DO NOT wipe caches before navigation - causes black screen
    // on iOS PWA. Just navigate; the new version's files are cache-busted by URL,
    // so they'll load fresh. Old caches get cleaned on next launch.
    try {
      setTimeout(go, 500); // Brief delay to show "Reloading..." message
    } catch (e) { go(); }
  }

  function fail() {
    state = 'failed';
    failCount++;
    if (failCount >= 2) {
      show('&#9888; Update failed. Keep this app and your saves. Check your connection, then <b>tap to retry</b>.');
    } else {
      show('&#9888; Update didn&rsquo;t work &mdash; <b>tap to retry</b>');
    }
  }

  banner.addEventListener('click', function () {
    if (state === 'available' || state === 'failed') apply();

  });

  // Recovery (Steve 2026-10-06): if we navigated here FOR an update (?v=X)
  // but we're still on the old build, the new files weren't downloadable
  // yet. Say so plainly instead of showing a tappable banner that loops.
  // Tapping the notice re-checks — the way out of the stuck state.

      window.history.replaceState(null, '', u0.toString());
    }

        try {

        } catch (e) {}
      }
    }

      var justUpdated = sessionStorage.getItem('oversight_just_updated');
      if (justUpdated && justUpdated === (window.BUILD_VERSION || '')) {
        sessionStorage.removeItem('oversight_just_updated');
        // The banner will show briefly to confirm
        state = 'idle';
        show('&#9989; Updated to build ' + justUpdated.substring(0, 7));
        setTimeout(function() {
          if (state === 'idle') banner.classList.add('hidden');
        }, 3000);
      }

  } catch (e) {}

  window.__oversightUpdate = { check: check, apply: apply };

  // must finish even while an older controlled page remains in browser history.
