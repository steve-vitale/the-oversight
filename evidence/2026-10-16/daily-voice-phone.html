<script>
/* PWA update flow (v2): version.json is the source of truth, NOT the service
   worker. The SW exists only for offline caching — updates no longer depend on
   the SW install/waiting/skipWaiting handover, which stalls silently on iOS.
   On launch, on foreground resume, and every minute we fetch version.json
   with cache:'no-store' plus a cache-buster; if it differs from the running
   BUILD_VERSION we show the banner. Tapping it unregisters all SWs, wipes all
   caches, and navigates to a cache-busted URL — the new version loads no
   matter what state the old SW is in. Every step reports progress; failures
   show retry + a manual fallback. Works even where SWs are unsupported. */
(function () {
  var banner = document.getElementById('update-banner');
  var state = 'idle'; // idle | available | working | failed
  var remoteVersion = null;
  var failCount = 0;

  function isNewer(local, remote) {
    if (!remote || remote === local) return false;
    function ts(v) { var m = /-(\d{8})-(\d{6})$/.exec(v || ''); return m ? m[1] + m[2] : null; }
    var a = ts(local), b = ts(remote);
    if (a && b) return b >= a; // same-second double commit still counts
    return true; // unparseable: any difference counts as newer
  }

  function show(html) { banner.innerHTML = html; banner.classList.remove('hidden'); }

  var PENDING_HTML = '&#9203; New version isn&rsquo;t ready to download yet &mdash; <b>tap to check again</b>.';

  // Steve 2026-10-06: version.json goes live on push, but GitHub Pages can
  // lag minutes behind. The new build is only "available" when its files are
  // actually downloadable — otherwise tap -> reload-old -> banner-again loops
  // forever with a banner that never dismisses. Every script URL in the
  // served index.html is cache-busted with the version tag, so the new tag's
  // presence there proves the new build is live.
  function assetsLive(remote) {
    var url = 'index.html?t=' + Date.now().toString(36);
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) return false;
      return r.text();
    }).then(function (text) {
      return typeof text === 'string' && text.indexOf(remote) !== -1;
    }).catch(function () { return false; });
  }

  function check() {
    var local = window.BUILD_VERSION || '';
    var url = 'version.json?t=' + Date.now().toString(36);
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      var remote = (j && j.version) || '';
      if (!isNewer(local, remote)) return false;
      return assetsLive(remote).then(function (live) {
        if (!live) {
          // Not downloadable yet — stay silent (or keep the pending notice).
          // The 15-min / foreground re-check is the auto-retry.
          if (state !== 'pending') state = 'idle';
          return false;
        }
        remoteVersion = remote;
        state = 'available';
        failCount = 0;
        show('&#11015; A new version is ready &mdash; <b>tap to update</b>');
        return true;
      });
    }).catch(function () { return false; }); // offline: stay silent
  }

  function apply() {
    if (state === 'working') return;
    state = 'working';
    show('&#9203; Downloading new version&hellip;');
    // Steve 2026-10-06: re-verify assets are live before navigating.
    // CDN can lag version.json; navigating to stale files causes the
    // "new version isn't available" pending loop.
    if (remoteVersion) {
      assetsLive(remoteVersion).then(function(live) {
        if (!live) {
          show('&#9203; New files are still propagating&hellip; waiting&hellip;');
          // Retry in 10s
          setTimeout(function() {
            state = 'available'; // allow re-tap
            apply();
          }, 10000);
          return;
        }
        // Assets confirmed live - proceed with update
        doApply();
      });
      return;
    }
    doApply();
  }
  function doApply() {
    // Bulletproof: every async step races a timeout, and navigation is
    // GUARANTEED via backstop timer. iOS can hang getRegistrations() or
    // caches.delete() forever — we never wait on them.
    var navigated = false;
    function go() {
      if (navigated) return; navigated = true;
      show('&#8635; Reloading into the new version&hellip;');
      try {
        var u = new URL(window.location.href);
        u.search = '';
        u.searchParams.set('v', remoteVersion || Date.now().toString(36));
        window.location.href = u.toString();
      } catch (e) {
        try { window.location.reload(); } catch (e2) { fail(); }
      }
    }
    function withTimeout(p, ms) {
      return Promise.race([p, new Promise(function (res) { setTimeout(res, ms); })]);
    }
    try {
      var cleanups = [];
      if ('serviceWorker' in navigator) {
        cleanups.push(withTimeout(
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return withTimeout(Promise.all(regs.map(function (r) {
              return withTimeout(r.unregister().catch(function () {}), 2000);
            })), 2500);
          }).catch(function () {}), 3000));
      }
      if ('caches' in window) {
        cleanups.push(withTimeout(
          caches.keys().then(function (ks) {
            return withTimeout(Promise.all(ks.map(function (k) {
              return withTimeout(caches.delete(k).catch(function () {}), 2000);
            })), 2500);
          }).catch(function () {}), 3000));
      }
      withTimeout(Promise.all(cleanups), 7000).then(go).catch(go);
      // Absolute backstop: navigate in 8s no matter what hangs.
      setTimeout(go, 8000);
    } catch (e) { go(); }
    function withTimeout(p, ms) {
      return Promise.race([p, new Promise(function (res) { setTimeout(res, ms); })]);
    }
    // Steve 2026-10-06: DO NOT wipe caches before navigation - causes black screen
    // on iOS PWA. Just navigate; the new version's files are cache-busted by URL,
    // so they'll load fresh. Old caches get cleaned on next launch.
    try {
      setTimeout(go, 500); // Brief delay to show "Reloading..." message
    } catch (e) { go(); }
  }

  function fail() {
    state = 'failed';
    failCount++;
    if (failCount >= 2) {
      show('&#9888; Auto-update failed. Delete the home-screen app and re-add it from Safari, then <b>tap to retry</b>.');
    } else {
      show('&#9888; Update didn&rsquo;t work &mdash; <b>tap to retry</b>');
    }
  }

  banner.addEventListener('click', function () {
    if (state === 'available' || state === 'failed') apply();
    else if (state === 'pending') check(); // manual re-check: way out of the stuck state
  });

  // Clean the cache-buster param after an update navigation.
  // Recovery (Steve 2026-10-06): if we navigated here FOR an update (?v=X)
  // but we're still on the old build, the new files weren't downloadable
  // yet. Say so plainly instead of showing a tappable banner that loops.
  // Tapping the notice re-checks — the way out of the stuck state.
  try {
    var u0 = new URL(window.location.href);
    // Clean old URL params (legacy)
    if (u0.searchParams.has('v') || u0.searchParams.has('fresh')) {
      u0.search = '';
      window.history.replaceState(null, '', u0.toString());
    }
    // Check sessionStorage for expected version (new robust method)
    var attempted = null;
    try { attempted = sessionStorage.getItem('oversight_expect_version'); } catch (e) {}
    if (!attempted) attempted = u0.searchParams.get('v'); // fallback to URL
    if (attempted && /^[0-9a-f]{7}-\d{8}-\d{6}$/.test(attempted)) {
      if (attempted !== (window.BUILD_VERSION || '')) {
        state = 'pending';
        show(PENDING_HTML);
      } else {
        // Update succeeded - show confirmation briefly
        // (Steve 2026-10-06: make updates verifiable)
        try {
          sessionStorage.setItem('oversight_just_updated', attempted);
        } catch (e) {}
      }
    }
    // Show update confirmation if we just updated
    try {
      var justUpdated = sessionStorage.getItem('oversight_just_updated');
      if (justUpdated && justUpdated === (window.BUILD_VERSION || '')) {
        sessionStorage.removeItem('oversight_just_updated');
        // The banner will show briefly to confirm
        state = 'idle';
        show('&#9989; Updated to build ' + justUpdated.substring(0, 7));
        setTimeout(function() {
          if (state === 'idle') banner.classList.add('hidden');
        }, 3000);
      }
    } catch (e) {}
  } catch (e) {}

  // Exposed for the build-tag tap in app.js and console debugging.
  window.__oversightUpdate = { check: check, apply: apply };

  // SW registration is for offline caching only now.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  check();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') check();
  });
  setInterval(function () { check(); }, 60 * 1000); // Steve 2026-10-06: 1 min, fast iteration
})();
</script>

let commandTrace={aiPlayer:0,strikes:0,foes:0,casters:0};
const CG=Scattering.Game,CS=CG.tbPlayerStrike,CV=CG.tbVillagerTurn,CM=CG.tbMonsterTurn;
CG.tbPlayerStrike=function(){const r=CS.apply(this,arguments);if(r)commandTrace.strikes++;return r;};
CG.tbVillagerTurn=function(v){if(v.kind==='player')commandTrace.aiPlayer++;if(v.key==='v_command')commandTrace.casters++;return CV.apply(this,arguments);};
CG.tbMonsterTurn=function(){commandTrace.foes++;return CM.apply(this,arguments);};

function prepareCommand(mode){const G=CG;G.tbfight=null;G.over=false;G.genRoster('Columbus, Ohio');G.newGame('Columbus, Ohio',null,G.generatedRoster[0].id);G.depart();const s=G.state.scholar,v=G.state.village;s.day=85;s.kcal=1200;s.health=100;s.abilities=[];s.inventory=[];s.insideHaven=false;s.knackChosen=true;s.knackChoices=null;G.state.systemArrived=true;G.state.systemAnimationShown=true;const roster=v.roster.slice(),id=roster.find(x=>x!==G.villagerId),friend=roster.find(x=>x!==G.villagerId&&x!==id);v.npcAbilities={[id]:mode==='class'?['the_crowd_moves']:[],[friend]:[]};v.npcSkills={[id]:[],[friend]:[]};v.npcGodhood=mode==='voice'?{[id]:{active:['voice_of_the_relay'],recognized:{voice_of_the_relay:85}}}:{};v.pantry=[];G.stockPantry(G.villageDailyNeed()*5,'Prepared command stores');G.npcNeeds(id).hunger=10;s.mx=3;s.my=4;G.genDetail(G.map.px,G.map.py);const tile=G.playerTile();tile.type='grove';tile.detail=Array.from({length:9},()=>Array(9).fill('grass'));tile.plantSpecies={};v.roster=[];s.monster={id:'review_drone',mx:4,my:4};G.startCombat('review_drone');v.roster=roster;const f=G.tbfight,p=G.tbFighter('p'),m=f.fighters.find(x=>x.kind==='monster');p.mx=3;p.my=4;p.hp=100;p.alive=true;p.acted=false;p.moveLeft=3;m.mx=4;m.my=4;m.hp=m.maxHp=10000;const a={key:'v_command',kind:'villager',villagerId:id,name:G.displayName(id),hp:100,maxHp:100,mx:2,my:4,alive:true,fled:false,ai:'brave'};f.fighters.push(a);if(mode==='class')f.fighters.push({...a,key:'v_command_friend',villagerId:friend,name:G.displayName(friend),mx:2,my:3});f.order=['p',a.key,...(mode==='class'?['v_command_friend']:[]),m.key];f.turnIdx=0;f.round=1;delete f._gv;commandTrace={aiPlayer:0,strikes:0,foes:0,casters:0};window.dispatchEvent(new CustomEvent('tb-turn',{detail:{phase:'player'}}));readCommand();}
document.getElementById('command-voice').onclick=()=>prepareCommand('voice');document.getElementById('command-class').onclick=()=>prepareCommand('class');document.getElementById('command-read').onclick=readCommand;

document.getElementById('command-pending').onclick=()=>{prepareCommand('voice');CG.tbfight.turnIdx=CG.tbfight.order.indexOf('v_command');CG.tbVillagerAbility(CG.tbFighter('v_command'));CG.save();CG.load(CG.state.runKey);window.dispatchEvent(new CustomEvent('tb-turn',{detail:{phase:'player'}}));readCommand();};
